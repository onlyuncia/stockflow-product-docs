name: StockFlow Pages

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'prototype/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm ci --prefix prototype --ignore-scripts --no-audit --no-fund
          python -m pip install -r prototype/requirements.txt
      - name: Test demo logic
        run: npm test --prefix prototype
      - name: Rebuild PDF, documents and diagram gallery
        run: npm run build --prefix prototype
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototype/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
